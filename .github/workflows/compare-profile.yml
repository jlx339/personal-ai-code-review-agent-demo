{
  "name": "Diagnostic free-model comparison",
  "on": {
    "push": {
      "paths": [
        "scripts/compare_profile.py",
        "evals/profile-run.json",
        ".github/workflows/compare-profile.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "pull-requests": "read"
  },
  "jobs": {
    "compare": {
      "if": "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "concurrency": {
        "group": "ai-review-model-${{ github.repository }}",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install trusted dependencies",
          "run": "python -m pip install uv==0.9.5\nuv sync --locked"
        },
        {
          "name": "Probe and compare explicit free model",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"
          },
          "run": "uv run --locked python scripts/compare_profile.py"
        },
        {
          "name": "Save diagnostic comparison",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "profile-comparison-${{ github.run_id }}",
            "path": "reports/profile/",
            "retention-days": 7,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
