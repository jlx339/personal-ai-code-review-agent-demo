{
  "name": "Trusted review worker",
  "on": {
    "workflow_call": {
      "inputs": {
        "pr_number": {
          "required": true,
          "type": "number"
        }
      },
      "secrets": {
        "GEMINI_API_KEY": {
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "pull-requests": "read"
  },
  "jobs": {
    "analyze": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "concurrency": {
        "group": "ai-review-model-${{ github.repository }}",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install trusted locked dependencies",
          "run": "python -m pip install uv==0.9.5\nuv sync --locked"
        },
        {
          "name": "Analyze pinned PR source",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "PR_NUMBER": "${{ inputs.pr_number }}"
          },
          "run": "uv run --locked ai-review analyze --pr \"$PR_NUMBER\" --output reports/current"
        },
        {
          "name": "Save review report",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ai-review-${{ github.run_id }}",
            "path": "reports/current/",
            "retention-days": 7,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
