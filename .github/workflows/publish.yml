{
  "name": "Publish approved AI findings",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "run_id": {
          "description": "Completed AI review workflow run ID",
          "required": true,
          "type": "string"
        },
        "approved_ids": {
          "description": "Comma-separated finding IDs explicitly approved for publication",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read",
    "pull-requests": "write"
  },
  "jobs": {
    "publish": {
      "if": "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "concurrency": {
        "group": "ai-review-publish-${{ github.repository }}",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install trusted locked dependencies",
          "run": "python -m pip install uv==0.9.5\nuv sync --locked"
        },
        {
          "name": "Publish selected findings",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "REVIEW_RUN_ID": "${{ inputs.run_id }}",
            "APPROVED_IDS": "${{ inputs.approved_ids }}"
          },
          "run": "uv run --locked ai-review publish --run-id \"$REVIEW_RUN_ID\" --approved-ids \"$APPROVED_IDS\""
        }
      ]
    }
  }
}
