{
  "name": "AI code review",
  "on": {
    "pull_request_target": {
      "types": [
        "opened",
        "synchronize",
        "reopened"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "pr_number": {
          "description": "PR number to review",
          "required": true,
          "type": "number"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "pull-requests": "read"
  },
  "concurrency": {
    "group": "ai-review-pr-${{ github.event.pull_request.number || inputs.pr_number }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "review": {
      "if": "${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.base.ref == github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}",
      "uses": "./.github/workflows/review-job.yml",
      "with": {
        "pr_number": "${{ github.event.pull_request.number || inputs.pr_number }}"
      },
      "secrets": {
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"
      }
    }
  }
}
