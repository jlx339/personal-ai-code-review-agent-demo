[project]
name = "personal-ai-code-review-agent"
version = "0.1.0"
description = "Evidence-backed GitHub reviews for personal Python AI projects"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "bandit>=1.8,<2"]
[project.scripts]
ai-review = "ai_review.cli:main"
[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ai_review"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
